```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Test Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #764ba2;
        }

        #message {
            margin-top: 20px;
            color: #333;
            font-weight: bold;
        }

        #datetime {
            margin-top: 15px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to GitHub!</h1>

        <p>
            This is my first test webpage.
            I am testing HTML, CSS, and JavaScript using GitHub.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div id="message"></div>
        <div id="datetime"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Success! JavaScript is working.";
        }

        function updateDateTime() {
            document.getElementById("datetime").textContent =
                "Current date and time: " + new Date().toLocaleString();
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
